services:
  bootstrap:
    build:
      context: .
    env_file:
      - .env
    environment:
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-pak-econ-rag}
    volumes:
      - ./:/app
    command: >
      sh -c "python wiki_to_rag_v3.py && python src/ingest.py"
    profiles:
      - bootstrap

  backend:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-pak-econ-rag}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
