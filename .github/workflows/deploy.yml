name: Deploy PakEconBot

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/pak-econ-bot"
            REPO_URL="https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git"

            echo "🚀 Starting deployment..."

            # ---------------------------
            # SAFE REPO SYNC
            # ---------------------------
            if [ -d "$APP_DIR/.git" ]; then
              echo "📦 Existing repo found. Updating..."
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            else
              echo "📦 Fresh clone (or broken folder detected)..."
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # ---------------------------
            # DOCKER DEPLOY
            # ---------------------------
            echo "🐳 Stopping old containers..."
            docker-compose -f docker-compose.prod.yml down || true

            echo "🔨 Building containers..."
            docker-compose -f docker-compose.prod.yml build

            echo "🚀 Starting containers..."
            docker-compose -f docker-compose.prod.yml up -d

            echo "✅ Deployment completed successfully!"