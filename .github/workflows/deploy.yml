name: Deploy PakEconBot

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/pak-econ-bot"
            REPO_URL="https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git"

            echo "🚀 Starting deployment..."

            # ---------------------------
            # SAFE REPO SYNC
            # ---------------------------
            if [ -d "$APP_DIR/.git" ]; then
              echo "📦 Existing repo found. Updating..."
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            else
              echo "📦 Fresh clone / broken repo detected..."
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # ---------------------------
            # DOCKER CHECK (important fix)
            # ---------------------------
            if ! command -v docker &> /dev/null; then
              echo "🐳 Installing Docker..."
              sudo apt update
              sudo apt install docker.io -y
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            if ! docker compose version &> /dev/null; then
              echo "🐳 Installing Docker Compose plugin..."
              sudo apt install docker-compose-plugin -y
            fi

            # ---------------------------
            # DEPLOY
            # ---------------------------
            echo "🐳 Stopping containers..."
            docker compose -f docker-compose.prod.yml down || true

            echo "🔨 Building containers..."
            docker compose -f docker-compose.prod.yml build

            echo "🚀 Starting containers..."
            docker compose -f docker-compose.prod.yml up -d

            echo "✅ Deployment successful!"