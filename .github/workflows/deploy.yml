name: Deploy PakEconBot

on:
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Backend → EC2 via SSH (unchanged)
  # ──────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/pak-econ-bot"
            REPO_URL="https://${{ secrets.GH_USERNAME }}:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git"

            echo "🚀 Starting deployment..."

            # ---------------------------
            # SAFE REPO SYNC
            # ---------------------------
            if [ -d "$APP_DIR/.git" ]; then
              echo "📦 Existing repo found. Updating..."
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            else
              echo "📦 Fresh clone / broken repo detected..."
              rm -rf "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"

            # ---------------------------
            # DOCKER CHECK (important fix)
            # ---------------------------
            if ! command -v docker &> /dev/null; then
              echo "🐳 Installing Docker..."
              sudo apt update
              sudo apt install docker.io -y
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            if ! docker compose version &> /dev/null; then
              echo "🐳 Installing Docker Compose plugin..."
              sudo apt install docker-compose-plugin -y
            fi

            # ---------------------------
            # DEPLOY
            # ---------------------------
            echo "🐳 Stopping containers..."
            docker compose -f docker-compose.prod.yml down || true

            echo "🔨 Building containers..."
            docker compose -f docker-compose.prod.yml build

            echo "🚀 Starting containers..."
            docker compose -f docker-compose.prod.yml up -d

            echo "✅ Deployment successful!"

  # ──────────────────────────────────────────────
  # Job 2: Frontend → S3 (runs in parallel)
  # ──────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Hashed JS/CSS chunks: 1-year immutable cache (filename changes on every build)
      - name: Sync assets (long-lived cache)
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      # index.html: no-cache so users always get the latest entry point
      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp frontend/dist/index.html s3://${{ secrets.AWS_S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"